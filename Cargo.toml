[package]
name = "mh-sort"
version = "0.1.0"
edition = "2024"
description = "Сортировка файлов по категориям и типам"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
# glow (OpenGL) вместо wgpu по умолчанию: exe меньше, сборка быстрее
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui-phosphor = { version = "0.14.0", default-features = false, features = ["subset"] }
egui_extras = "0.36.2"
indexmap = { version = "2.14.2", features = ["serde"] }
infer = "0.22.0"
open = "5.4.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
